name: Probe Kubernetes deploy

# Temporary — verifies backend/k8s/*.yaml actually works: builds the image,
# spins up a real kind cluster, loads the image into it (no registry —
# same as the local dev loop in backend/k8s/README.md), applies the
# manifests, and confirms the Deployment reaches 2/2 ready pods behind the
# Service. The sandboxed dev environment this was written in can't reach
# any container registry's CDN (see backend/Dockerfile's probe history),
# so `kind create cluster` can't be tested locally there either — it needs
# to pull its own node image the same way `docker build` needed python's.
# Deleted once this confirms the manifests work.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f backend/Dockerfile -t buff-api:dev .
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: buff
      - name: Load the image into the cluster (no registry involved)
        run: kind load docker-image buff-api:dev --name buff
      - name: Apply the manifests
        run: kubectl apply -f backend/k8s/deployment.yaml -f backend/k8s/service.yaml
      - name: Wait for the Deployment to be ready
        run: kubectl rollout status deployment/buff-api --timeout=90s
      - name: Show pod/service state
        run: |
          kubectl get pods -o wide
          kubectl get deployment buff-api -o wide
          kubectl get svc buff-api
      - name: Hit it through the Service (not a pod directly)
        run: |
          kubectl run curl-probe --image=curlimages/curl:8.11.1 --restart=Never --rm -i --command -- \
            sh -c '
              for i in $(seq 1 20); do
                curl -sf http://buff-api.default.svc.cluster.local/health && exit 0
                sleep 2
              done
              echo "never came up"; exit 1
            '
      - name: Kill one pod and confirm the Deployment replaces it
        run: |
          FIRST_POD=$(kubectl get pods -l app=buff-api -o jsonpath='{.items[0].metadata.name}')
          echo "deleting $FIRST_POD"
          kubectl delete pod "$FIRST_POD"
          kubectl rollout status deployment/buff-api --timeout=60s
          kubectl get pods -l app=buff-api
      - name: Describe deployment on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deployment buff-api
          kubectl logs -l app=buff-api --tail=100 || true
