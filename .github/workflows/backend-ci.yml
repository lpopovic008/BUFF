name: Backend CI

# Path-filtered to backend/ — unlike deploy.yml (which runs on every push
# since a Next.js static build is cheap and there's only one deploy
# target), this is a separate pipeline for a separate part of the repo. A
# frontend-only commit has no reason to re-run Python tests or rebuild a
# Docker image that didn't change.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest -v
        working-directory: backend

  build-and-push:
    needs: test
    # Only from main, not PRs — a PR (possibly from a fork) shouldn't be
    # able to publish an image under this project's name just by opening
    # one. Images only get built from code that's already been merged.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN, not a separately managed secret — GitHub mints
          # this automatically for every workflow run and scopes it to
          # this repo, which is enough to push to this repo's own GHCR
          # namespace (granted by the packages: write permission above).
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # ghcr.io (and OCI registries generally) require a lowercase
          # image name — github.repository_owner is already lowercase
          # here, but github.repository would carry this repo's own
          # capitalized "BUFF" straight into an invalid tag, so it's
          # spelled out explicitly instead of reused.
          tags: |
            ghcr.io/${{ github.repository_owner }}/buff-api:latest
            ghcr.io/${{ github.repository_owner }}/buff-api:${{ github.sha }}
