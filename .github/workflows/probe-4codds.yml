name: Probe 4codds (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: robots.txt and terms
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          echo "===== robots.txt (from the site's own section)"
          curl -sS -m 30 -A "$UA" https://4codds.com/robots.txt | sed -n '/robots.txt for 4codds/,$p'
          for u in https://4codds.com/terms.html https://4codds.com/terms ; do
            echo "===== $u"
            curl -sS -L -m 30 -A "$UA" -o body.html -w "HTTP %{http_code} bytes=%{size_download}\n" "$u" || true
            python3 - <<'PY'
          import re, html
          s = open("body.html", encoding="utf-8", errors="replace").read()
          s = re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", s)
          s = re.sub(r"(?s)<[^>]+>", " ", s)
          s = re.sub(r"\s+", " ", html.unescape(s)).strip()
          print(s[:8000])
          PY
          done
