name: Fit trade adjustment

# Read-only study, on demand: how much more a side gives trading several pieces for fewer bigger ones (see scripts/fit-trade-adjustment.ts).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fit-trade-adjustment.ts
