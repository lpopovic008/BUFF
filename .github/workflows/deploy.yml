name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public OAuth client ID for Save-to-Doc (see src/lib/google-config.ts) —
          # not a secret, but kept out of source so it's easy to rotate. Unset
          # until the repo has a "GOOGLE_CLIENT_ID" Actions variable configured;
          # the button stays hidden in the meantime.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # Base URL of the deployed backend/ FastAPI service (e.g.
          # https://buff-api.onrender.com), used only by the "Generate with
          # AI" recap button (see src/lib/recap-ai.ts). Not a secret — it's a
          # public URL baked into the static site — but kept out of source so
          # it's easy to repoint. Unset until the repo has an "API_BASE_URL"
          # Actions variable configured; the button stays disabled in the
          # meantime.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
          # Supabase project for accounts + cross-device sync (see
          # src/lib/supabase.ts, docs/architecture.md). Committed directly,
          # not gated on a repo variable — this is the publishable key, the
          # safe-to-expose client-side key (same privilege level the old
          # "anon" key had); every real access rule lives in Postgres Row
          # Level Security (see supabase/schema.sql), not in keeping this
          # value secret.
          NEXT_PUBLIC_SUPABASE_URL: "https://uybcjhzfwidbetnzfxwu.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_5LsoA6Lo0Jo1L8baoil5gw_j0b5WOey"
        # Requires Pages to already be enabled on the repo with Source set to
        # "GitHub Actions" (Settings → Pages). That is a one-time manual step:
        # the workflow's GITHUB_TOKEN is not permitted to create a Pages site,
        # so `enablement: true` here fails with "Resource not accessible by
        # integration" and cannot substitute for it.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
