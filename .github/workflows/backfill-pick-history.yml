name: Backfill pick history

# On demand: drafted picks' KTC values from the Internet Archive (see scripts/backfill-pick-history.ts).
# Slow on purpose — the archive throttles hard — and commits whatever it got, even if cut short.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: value-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/backfill-pick-history.ts
        timeout-minutes: 320
        continue-on-error: true
      - name: Commit backfilled history
        id: commit
        run: |
          if [ -z "$(git status --porcelain public/data/value-history.json)" ]; then
            echo "Nothing backfilled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/value-history.json
          git commit -m "Backfill drafted picks' value history from the Internet Archive"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
