name: Probe Docker build

# Temporary — verifies backend/Dockerfile actually builds and runs. The
# sandboxed dev environment this was written in blocks the CDN hosts every
# major container registry (Docker Hub, ECR, MCR) redirects blob downloads
# through, so `docker build` can't be tested locally there. GitHub-hosted
# runners have real network access and Docker pre-installed. Deleted once
# this has confirmed the image works.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f backend/Dockerfile -t buff-api:ci .
      - name: Run it
        run: docker run -d --name buff-api -p 8000:8000 buff-api:ci
      - name: Wait for it to come up
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "up after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Hit the real endpoints
        run: |
          echo "--- /health ---"
          curl -sS http://localhost:8000/health
          echo
          echo "--- /players/values?position=QB&limit=2 ---"
          curl -sS "http://localhost:8000/players/values?position=QB&limit=2"
          echo
          echo "--- /players/stats?min_games=1&limit=2 ---"
          curl -sS "http://localhost:8000/players/stats?min_games=1&limit=2"
          echo
          echo "--- container user (should not be root) ---"
          docker exec buff-api whoami
          echo "--- image size ---"
          docker image inspect buff-api:ci --format '{{.Size}}'
      - name: Container logs
        if: always()
        run: docker logs buff-api
