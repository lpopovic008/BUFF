name: Update value history

# KTC values over time, for the values page's trade analyzer — daily, after
# the day's values (13:00 UTC), and on demand. A daily run only fetches the
# pages of players it hasn't got yet; "full" fetches every page again.
on:
  schedule:
    - cron: "40 13 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Fetch every player's page again (a long run) instead of only new ones"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: value-history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-value-history.ts ${{ inputs.full && '--full' || '' }}
      - name: Commit updated history
        id: commit
        run: |
          if [ -z "$(git status --porcelain public/data/value-history.json)" ]; then
            echo "No change in value history."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/value-history.json
          git commit -m "Update value history"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger deploy
        # A push made with the default GITHUB_TOKEN doesn't set off other workflows (see player-values.yml).
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
