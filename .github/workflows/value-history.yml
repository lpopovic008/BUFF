name: Update value history

# KTC values over time, for the values page's trade analyzer. On demand while it's being built.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Print a KTC player page's shape instead of a full fetch — writes nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-value-history.ts ${{ inputs.probe && '--probe' || '' }}
