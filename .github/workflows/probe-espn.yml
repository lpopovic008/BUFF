# Temporary: what ESPN's scoreboard and play-by-play say about records and field direction (to be removed).
name: Probe ESPN
on:
  push:
    paths: [".github/workflows/probe-espn.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Records on week 1 and week 5 games
        run: |
          for wk in 1 5; do
            echo "== week $wk"
            curl -s "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=$wk&dates=2026" \
              | jq -r '.events[0:4][] | .competitions[0] | "\(.status.type.state) " + ([.competitors[] | "\(.homeAway) \(.team.abbreviation) \(.score) records=\(.records // [] | map("\(.type):\(.summary)") | join(","))"] | join(" | "))'
          done
      - name: A week 5 game's plays — the fields on each play's start
        run: |
          id=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=5&dates=2026" | jq -r '.events[0].id')
          echo "event $id"
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$id" > s.json
          jq -r '.header.competitions[0].competitors[] | "\(.homeAway) \(.team.abbreviation) id=\(.id)"' s.json
          echo "-- start keys of the first plays"
          jq -c '[.drives.previous[0:3][] | .team.abbreviation as $t | .plays[0:3][] | {t: $t, q: .period.number, start: .start, end: .end, text: .text[0:50]}]' s.json | head -c 4000
          echo
          echo "-- one play, every key"
          jq -c '.drives.previous[1].plays[1] | del(.participants)' s.json | head -c 2500
          echo
          echo "-- each quarter's first play: team, start yardLine/yardsToEndzone"
          jq -r '[.drives.previous[] | .team.abbreviation as $t | .plays[] | {t: $t, q: .period.number, yl: .start.yardLine, ytez: .start.yardsToEndzone, txt: .start.possessionText}] | group_by(.q)[] | .[0:4][] | "\(.q) \(.t) yardLine=\(.yl) toEndzone=\(.ytez) \(.txt)"' s.json
