name: Fetch team logos

# Temporary: pulls every NFL team's current logo from a runner with real
# network access and commits them to scripts/team-logos-source/, for the
# black-and-white logo repaint. Deleted once the new logos are in the app.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/fetch-team-logos.sh
      - name: Commit the downloaded logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/team-logos-source
          git commit -m "Add the current NFL team logos, fetched from Wikipedia and ESPN" || exit 0
          git push
