name: Probe Settings in WebKit
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: node .github/probe/webkit-settings.mjs current
      - run: git checkout 2e3d36c -- "src/app/(chrome)/settings/page.tsx" && npm run build
      - run: node .github/probe/webkit-settings.mjs before-fix
