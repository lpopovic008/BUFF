name: Probe per-player projections (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dump starters
        run: |
          cat > check.mts <<'TS'
          import { weighProjection } from "./src/lib/sleeper";
          import { parseScoreboard } from "./src/lib/nfl-schedule";
          const S = "https://api.sleeper.app/v1";
          const j = async (u: string) => (await fetch(u)).json();
          const user = await j(`${S}/user/lpop8`);
          const state = await j(`${S}/state/nfl`);
          const leagues = await j(`${S}/user/${user.user_id}/leagues/nfl/${state.season}`);
          const league = leagues.find((l: any) => /epstein/i.test(l.name));
          const [matchups, players, proj, board] = await Promise.all([
            j(`${S}/league/${league.league_id}/matchups/${state.week}`), j(`${S}/players/nfl`),
            j(`https://api.sleeper.app/projections/nfl/${state.season}/${state.week}?season_type=regular&position[]=QB&position[]=RB&position[]=WR&position[]=TE&position[]=K&position[]=DEF`),
            j(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${state.week}&dates=${state.season}`),
          ]);
          const projBy = new Map(proj.map((e: any) => [e.player_id, weighProjection(e.stats ?? {}, league.scoring_settings) ?? 0]));
          const games = parseScoreboard(board);
          const gameBy = new Map<string, any>(); for (const g of games) { gameBy.set(g.homeTeam, g); gameBy.set(g.awayTeam, g); }
          const out = matchups.map((m: any) => ({ rid: m.roster_id, mid: m.matchup_id, points: m.points, starters: m.starters.map((p: string) => {
            const team = players[p]?.team; const g = team ? gameBy.get(team) : undefined;
            return [p, players[p]?.position, team, g?.kickoff ?? null, g?.state ?? null, g?.period ?? null, g?.clockSeconds ?? null, +(Number(projBy.get(p) ?? 0)).toFixed(2), m.players_points?.[p] ?? 0];
          }) }));
          console.log("JSON " + JSON.stringify(out));
          TS
          npx tsx ./check.mts
