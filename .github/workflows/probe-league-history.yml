name: Probe league history

# TEMPORARY: dumps real Sleeper season/bracket/matchup data to the run log so
# the final-placement logic can be written against real responses. Manual only.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/probe-league-history.ts
