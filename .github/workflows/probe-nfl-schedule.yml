name: Probe NFL schedule

# TEMPORARY: confirms ESPN's scoreboard week query + venue shape. Manual only.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/probe-nfl-schedule.ts
