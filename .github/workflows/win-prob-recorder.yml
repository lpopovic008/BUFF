name: Record win probability

# A reading of every matchup in the commish's leagues every 5 minutes while
# NFL games are on — the league page's live win-probability line, recorded
# even when nobody has the page open.
#
# GitHub runs scheduled workflows only on a best-effort basis (a 5-minute
# schedule can go hours between runs), so the schedule just needs to land
# once near game time: each run then keeps itself going, recording every
# 5 minutes for as long as a game is on (or about to kick off, or just
# ended, for the final reading), and hands over to a fresh run before
# GitHub's 6-hour job limit. A run that finds nothing to do stops at once.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: win-prob-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Anything to record?
        id: gate
        run: |
          state=$(bash scripts/winprob-gate.sh)
          echo "Scoreboard: $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.state != 'idle' || github.event_name == 'workflow_dispatch'
        run: git sparse-checkout disable
      - if: steps.gate.outputs.state != 'idle' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.state != 'idle' || github.event_name == 'workflow_dispatch'
        run: npm ci --ignore-scripts
      - name: Record every 5 minutes while games are on
        if: steps.gate.outputs.state != 'idle' || github.event_name == 'workflow_dispatch'
        env:
          WINPROB_USERNAMES: lpop8
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The readings live on their own branch, so recording never touches
          # main or triggers a deploy.
          if git fetch --depth 1 origin winprob-data:winprob-data; then
            git worktree add data winprob-data
          else
            git worktree add --orphan -b winprob-data data
          fi

          record() {
            npx tsx scripts/record-win-prob.ts data || return 0
            git -C data add -A
            if git -C data diff --cached --quiet; then return 0; fi
            # One commit, rewritten each time: the branch holds the current
            # week's lines, not thousands of 5-minute snapshots.
            if git -C data rev-parse --verify -q HEAD >/dev/null; then
              git -C data commit -q --amend -m "Win probability readings"
            else
              git -C data commit -q -m "Win probability readings"
            fi
            git -C data push -q --force origin winprob-data || true
          }

          # Hand over to a fresh run well inside the job's time limit.
          deadline=$(( $(date +%s) + 330 * 60 ))
          first=1
          while :; do
            state=$(bash scripts/winprob-gate.sh)
            echo "$(date -u +%H:%M) scoreboard: $state"
            # A manual run always takes one reading, even with nothing on.
            if [ "$state" = "live" ] || { [ "$MANUAL" = "true" ] && [ -n "$first" ]; }; then record; fi
            first=
            if [ "$state" = "idle" ]; then
              echo "Nothing on or coming up; done."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Handing over to a fresh run."
              gh workflow run win-prob-recorder.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
              exit 0
            fi
            sleep 300
          done
