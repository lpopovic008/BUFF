name: Record win probability

# Every 5 minutes through the hours NFL games are played (UTC: 13:00–05:59,
# i.e. London-game mornings through Monday/Thursday nights, Eastern), a
# reading of every matchup in the commish's leagues — the league page's live
# win-probability line, recorded even when nobody has the page open. A quick
# look at the scoreboard first: unless a game is on (or just ended, for the
# final reading), the run stops there. GitHub can start scheduled runs a few
# minutes late; the page fills gaps with its own readings while it's open.
on:
  schedule:
    - cron: "*/5 0-5,13-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: win-prob-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Any game on?
        id: gate
        run: |
          now=$(date +%s)
          count=$(curl -sf https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard | jq --argjson now "$now" '
            [.events[]? | .competitions[0] as $c
              | ($c.status.type.state) as $s
              | (try ($c.date | sub("T(?<h>[0-9]{2}):(?<m>[0-9]{2})Z$"; "T\(.h):\(.m):00Z") | fromdateiso8601) catch 0) as $k
              | select($s == "in" or ($s == "post" and ($now - $k) > 10800 and ($now - $k) < 19800))]
            | length' || echo 0)
          echo "Games on or just ended: $count"
          echo "run=$([ "${count:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci --ignore-scripts
      - name: Record readings
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          WINPROB_USERNAMES: lpop8
        run: |
          # The readings live on their own branch, so recording never touches
          # main or triggers a deploy.
          if git fetch --depth 1 origin winprob-data:winprob-data; then
            git worktree add data winprob-data
          else
            git worktree add --orphan -b winprob-data data
          fi
          npx tsx scripts/record-win-prob.ts data
          cd data
          git add -A
          if git diff --cached --quiet; then
            echo "No new readings."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One commit, rewritten each time: the branch holds the current
          # week's lines, not thousands of 5-minute snapshots.
          if git rev-parse --verify -q HEAD >/dev/null; then
            git commit -q --amend -m "Win probability readings"
          else
            git commit -q -m "Win probability readings"
          fi
          git push -q --force origin winprob-data
